---

- name: Deploy Nginx Web Page
  hosts: webservers
  become: true

  tasks:
     - name: Deploy HTML Page
       ansible.builtin.copy:
          src: ../files/index.html
          dest: /var/www/html/index.html
          mode: "0644"

     - name: Ensure Nginx is running
       ansible.builtin.systemd:
          name: nginx
          state: started
          enabled: true


