---

- name: Configure Nginx 
  hosts: webservers
  become: true
  serial: 1
  
  tasks:

     - name: Deploy Nginx Template 
       ansible.builtin.template:
            src: ../templates/lab-nginx.conf.j2
            dest: /etc/nginx/conf.d/lab.conf
            mode: "0644"
            backup: true
       notify: Validate and reload Nginx


  handlers:
     - name: Validate Nginx
       ansible.builtin.command: nginx -t
       changed_when: false
       listen: Validate and reload Nginx

     - name: Reload Nginx
       ansible.builtin.systemd_service:
          name: nginx
          state: reloaded
       listen: Validate and reload Nginx

