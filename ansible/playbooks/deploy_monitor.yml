---

- name: Deploy monitoring scripts
  hosts: webservers
  gather_facts: true

  tasks:
    - name: Create scripts directory
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/server-monitor/scripts"
        state: directory
        mode: "0755"

    - name: Copy monitoring script
      ansible.builtin.copy:
        src: ../../scripts/system_info.sh
        dest: "{{ ansible_user_dir }}/server-monitor/scripts/system_info.sh"
        mode: "0755"
